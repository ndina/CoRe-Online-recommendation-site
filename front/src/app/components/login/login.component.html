<form class="form-card text-center" (ngSubmit)="login()">
  <button type="button" class="btn-close close-btn" aria-label="Close" (click)="close()"></button>
  <p class="h4 mb-4">Log in</p>
  <input type="text" class="form-control mb-3" [(ngModel)]="username" name="username" placeholder="Username"
         autocomplete="username" required>
  <input type="password" class="form-control mb-3" [(ngModel)]="password" name="password" placeholder="Password"
         autocomplete="current-password" required>
  @if (error) {
    <div class="alert alert-danger py-2">{{ error }}</div>
  }
  <button class="btn btn-info w-100 my-3" type="submit">Log in</button>
  <p class="mb-0">Not a member? <a routerLink="/signUp">Sign up</a></p>
</form>

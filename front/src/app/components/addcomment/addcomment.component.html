<form class="form-card text-center" (ngSubmit)="addComment()">
  <button type="button" class="btn-close close-btn" aria-label="Close" (click)="close()"></button>
  <p class="h4 mb-4">Add a review</p>
  <textarea class="form-control mb-3" rows="3" [(ngModel)]="content" name="content"
            placeholder="What did you think?" required></textarea>
  <input type="number" class="form-control mb-3" [(ngModel)]="rating" name="rating" min="1" max="10"
         placeholder="Rating from 1 to 10" required>
  <input type="text" class="form-control mb-3" [(ngModel)]="name" name="name" placeholder="Your name" required>
  @if (error) {
    <div class="alert alert-danger py-2">{{ error }}</div>
  }
  <button class="btn btn-info w-100 my-3" type="submit" [disabled]="saving">Add review</button>
</form>

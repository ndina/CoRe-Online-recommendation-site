<form class="form-card text-center" (ngSubmit)="signUp()">
  <button type="button" class="btn-close close-btn" aria-label="Close" (click)="close()"></button>
  <p class="h4 mb-4">Sign up</p>
  <div class="row g-2 mb-3">
    <div class="col">
      <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="First name">
    </div>
    <div class="col">
      <input type="text" class="form-control" [(ngModel)]="surname" name="surname" placeholder="Last name">
    </div>
  </div>
  <input type="text" class="form-control mb-3" [(ngModel)]="username" name="username" placeholder="Username"
         autocomplete="username" required>
  <input type="email" class="form-control mb-3" [(ngModel)]="email" name="email" placeholder="E-mail" required>
  <input type="password" class="form-control mb-3" [(ngModel)]="password" name="password"
         placeholder="Password (at least 8 characters)" autocomplete="new-password" required>
  @if (error) {
    <div class="alert alert-danger py-2">{{ error }}</div>
  }
  <button class="btn btn-info w-100 my-3" type="submit">Create account</button>
  <p class="mb-0">Already a member? <a routerLink="/login">Log in</a></p>
</form>
